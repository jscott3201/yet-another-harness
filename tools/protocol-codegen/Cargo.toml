[package]
name = "oa-protocol-codegen"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
