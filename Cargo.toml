[workspace]
resolver = "3"
members = [
    "crates/exp001-harness",
    "crates/yah-compose",
    "crates/yah-kernel",
    "crates/yah-plugin-host",
    "crates/yah-plugin-wasm",
]

# Crate boundaries are deliberately provisional during the full-harness pivot.
# The composition crate keeps a narrow dependency surface while its live
# lifecycle and reversible-cleanup semantics are proved beside the retained
# reliability kernel.

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# G02-qualified Selene revision. Exact Git pins keep local and hosted builds on
# the same storage implementation.
selene-core = { package = "selene-db-core", git = "https://github.com/jscott3201/selene-db.git", rev = "9a61de124ffa2b471461d83e6e51c5856c81f791" }
selene-graph = { package = "selene-db-graph", git = "https://github.com/jscott3201/selene-db.git", rev = "9a61de124ffa2b471461d83e6e51c5856c81f791" }
selene-persist = { package = "selene-db-persist", git = "https://github.com/jscott3201/selene-db.git", rev = "9a61de124ffa2b471461d83e6e51c5856c81f791" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rand = "0.9"
rand_chacha = "0.9"
blake3 = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
schemars = "1.2.2"
serde_json_canonicalizer = "0.3.2"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
# Strict plugin-manifest parsing uses the community SemVer and TOML reference
# implementations rather than growing security-sensitive ad hoc parsers.
semver = "1.0.28"
toml = "1.1.4"
# WSM-001 compile-time compatibility probes. Wasmtime remains test-only until
# yah-plugin-wasm owns an executable driver in WSM-002.
wasmtime = { version = "=47.0.3", default-features = false, features = ["component-model", "runtime", "std"] }
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc", "std"] }
wit-parser = { version = "=0.252.0", default-features = false, features = ["std"] }
