[workspace]
resolver = "3"
members = [
    "crates/exp001-harness",
    "crates/yah-compose",
    "crates/yah-kernel",
    "crates/yah-plugin-host",
    "crates/yah-plugin-wasm",
]

# Crate boundaries are deliberately provisional during the full-harness pivot.
# The composition crate keeps a narrow dependency surface while its live
# lifecycle and reversible-cleanup semantics are proved beside the retained
# reliability kernel.

# The two crates that do Cranelift's compiling are optimised even in dev and
# test builds. Nothing else is, including every workspace crate.
#
# Guest components are compiled at test time, and unoptimised Cranelift spends
# about 115 seconds of that on the 12 MB component the TypeScript example
# produces. The case around it then sits either side of the harness's 120s
# per-test terminate - measured at 117.7s in one run and terminated at 120.0s in
# another - so without this it does not merely run slowly, it fails the run, and
# which way it lands is a matter of machine load. This changes how fast a
# dependency runs, not what it does; every other test's duration is unmoved.
#
# Scoped rather than `"*"` because the cost is recurring: the gate cleans before
# every run and CI never caches `target/`. Measured on one machine, clean
# `cargo build --workspace --all-targets` against the example-guest tests:
#
#   nothing             33.6s build, tests TIME OUT
#   these two           42.4s build, tests 16.0s
#   every dependency   111.8s build, tests  8.7s
#
# The middle row buys the whole of the fix for a ninth of the bottom row's extra
# build time. Hosted CI is slower than the machine above, so what earns the
# middle row is that it lands far inside the terminate rather than just inside
# it; the bottom row's remaining 7.3s is not worth 69s of build on every run.
[profile.dev.package.cranelift-codegen]
opt-level = 2

[profile.dev.package.regalloc2]
opt-level = 2

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# G02-qualified Selene revision. Exact Git pins keep local and hosted builds on
# the same storage implementation.
selene-core = { package = "selene-db-core", git = "https://github.com/jscott3201/selene-db.git", rev = "9a61de124ffa2b471461d83e6e51c5856c81f791" }
selene-graph = { package = "selene-db-graph", git = "https://github.com/jscott3201/selene-db.git", rev = "9a61de124ffa2b471461d83e6e51c5856c81f791" }
selene-persist = { package = "selene-db-persist", git = "https://github.com/jscott3201/selene-db.git", rev = "9a61de124ffa2b471461d83e6e51c5856c81f791" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rand = "0.9"
rand_chacha = "0.9"
blake3 = "1"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
schemars = "1.2.2"
serde_json_canonicalizer = "0.3.2"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }
# Strict plugin-manifest parsing uses the community SemVer and TOML reference
# implementations rather than growing security-sensitive ad hoc parsers.
semver = "1.0.28"
toml = "1.1.4"
# WSM-001 compile-time compatibility probes, extended in WSM-002 to an
# executable driver. `cranelift` is what makes `Component::new` exist at all:
# `runtime` alone can only load a precompiled artifact. `wat` lets the test
# corpus carry its guest as reviewable text instead of a checked-in binary.
wasmtime = { version = "=47.0.3", default-features = false, features = ["async", "component-model", "cranelift", "runtime", "std", "wat"] }
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc", "std"] }
wit-parser = { version = "=0.252.0", default-features = false, features = ["std"] }
# Encodes a guest's core module as a component - the step between what a Rust
# guest toolchain emits and what a host can instantiate.
wit-component = { version = "=0.247.0", default-features = false }
