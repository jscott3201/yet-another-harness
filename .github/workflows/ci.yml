# CI for Yet Another Harness — runs on pushes and PRs to `main`.
#
# Rust executes inside one digest-pinned, multi-architecture Linux image. The
# manifest resolves natively to amd64 on hosted runners and arm64 on Apple
# Silicon Docker. Cargo source caches are safe to reuse; build targets are not
# cached so every hosted run compiles from a fresh target directory.
#
# Security: no `${{ github.event.* }}` in any `run:` (confined to if:/with:/env:).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/check-file-size.sh
      - run: bash .github/scripts/check-no-secrets.sh

  rust:
    name: rust (native linux container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rust:1.97.1-bookworm@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
      options: --init
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore locked Cargo sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-src-linux-${{ runner.arch }}-rust-1.97.1-${{ hashFiles('Cargo.lock', 'tools/protocol-codegen/Cargo.lock') }}
          restore-keys: |
            cargo-src-linux-${{ runner.arch }}-rust-1.97.1-
      - name: Install pinned cargo-nextest
        run: bash scripts/install-nextest.sh
      - name: Install Node for the TypeScript example guest
        # DEC-038 builds every guest artifact from source at gate time, and the
        # TypeScript one needs `jco`. Pinned to a major the lockfile was
        # resolved against; `npm ci` in the build script does the rest.
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: examples/guests/ts-example/package-lock.json
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path tools/protocol-codegen/Cargo.toml
      - name: Run canonical Rust lane
        run: bash scripts/ci-rust.sh
      - name: Upload Nextest JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit-linux-${{ runner.arch }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
