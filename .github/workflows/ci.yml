# CI for open-agent — runs on pushes and PRs to `main`.
#
# Selene is an exact public Git dependency, so hosted CI runs the same locked
# compile and test gates as local development.
#
# Security: no `${{ github.event.* }}` in any `run:` (confined to if:/with:/env:).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - run: cargo fmt --all --check

  file-size-cap:
    name: source-file cap (700 LOC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash .github/scripts/check-file-size.sh

  generated-protocol:
    name: generated protocol artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/protocol-codegen/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/protocol-codegen/Cargo.toml -- -D warnings
      - run: cargo run --locked --manifest-path tools/protocol-codegen/Cargo.toml -- --check

  workspace:
    name: workspace clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  no-secret-scan:
    name: no-secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash .github/scripts/check-no-secrets.sh
