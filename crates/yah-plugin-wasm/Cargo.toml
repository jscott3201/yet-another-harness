[package]
name = "yah-plugin-wasm"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Provisional WIT contract and Wasmtime component driver for YAH"

[dependencies]
# `sync` only: `tokio::sync::Mutex` needs no reactor, so an async-aware lock
# here does not oblige a driver consumer to run on Tokio.
tokio = { workspace = true, features = ["sync"] }
wasmtime.workspace = true
yah-plugin-host = { path = "../yah-plugin-host" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wit-bindgen.workspace = true
yah-compose = { path = "../yah-compose" }
wit-parser.workspace = true
wit-component.workspace = true
